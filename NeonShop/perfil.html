<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Perfil - NeonShop</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">
            <h1>NEONSHOP</h1>
        </div>

        <nav class="menu">

            <a href="index.html">
                Home
            </a>

            <a href="carrinho.html">
                Carrinho
            </a>

        </nav>

    </header>

    <section class="login-container">

        <div class="perfil-box">

            <img
                src="img/avatar.png"
                class="avatar"
            >

            <h2 id="perfil-nome">
                Usuário
            </h2>

            <p id="perfil-email">
                email@email.com
            </p>

            <span class="status">
                ONLINE
            </span>

            <button onclick="logout()">
                Sair da Conta
            </button>

        </div>

    </section>

    <div id="toast"></div>

    <script src="js/script.js"></script>

</body>

</html>
