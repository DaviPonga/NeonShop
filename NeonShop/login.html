<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NeonShop</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        .auth-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background:
                radial-gradient(ellipse at 30% 50%, rgba(0,255,255,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(0,100,255,0.06) 0%, transparent 60%),
                #050510;
            position: relative;
            overflow: hidden;
        }
        .auth-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .auth-card {
            background: rgba(10,12,20,0.95);
            border: 1px solid rgba(0,255,255,0.15);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            position: relative;
            box-shadow: 0 0 60px rgba(0,255,255,0.08), 0 30px 80px rgba(0,0,0,0.5);
            animation: cardIn 0.6s ease both;
        }
        @keyframes cardIn {
            from { opacity:0; transform: translateY(30px); }
            to   { opacity:1; transform: translateY(0); }
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 35px;
        }
        .auth-logo h1 {
            font-size: 28px;
            color: cyan;
            text-shadow: 0 0 20px cyan;
            letter-spacing: 3px;
        }
        .auth-logo p { color: #555; font-size: 13px; margin-top: 6px; letter-spacing: 1px; }
        .auth-title {
            font-size: 22px;
            font-weight: 900;
            color: white;
            margin-bottom: 6px;
        }
        .auth-subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        .input-group {
            margin-bottom: 18px;
            position: relative;
        }
        .input-group label {
            display: block;
            color: #aaa;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .input-group .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-group .input-icon {
            position: absolute;
            left: 16px;
            font-size: 16px;
            pointer-events: none;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: rgba(0,255,255,0.5);
            background: rgba(0,255,255,0.03);
            box-shadow: 0 0 0 3px rgba(0,255,255,0.08);
        }
        .input-group input::placeholder { color: #444; }
        .toggle-senha {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            width: auto;
            margin: 0;
            transition: color 0.2s;
        }
        .toggle-senha:hover { color: cyan; }
        .btn-auth {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, cyan, #0077ff);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
            margin-top: 8px;
        }
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,255,255,0.35);
        }
        .btn-auth:active { transform: translateY(0); }
        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-outline {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: cyan;
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 12px;
        }
        .btn-outline:hover {
            background: rgba(0,255,255,0.07);
            border-color: cyan;
        }
        .auth-msg {
            min-height: 22px;
            font-size: 13px;
            text-align: center;
            margin-top: 15px;
            border-radius: 8px;
            padding: 8px 12px;
            display: none;
        }
        .auth-msg.erro { display: block; background: rgba(255,50,80,0.1); color: #ff5060; border: 1px solid rgba(255,50,80,0.2); }
        .auth-msg.ok   { display: block; background: rgba(0,255,100,0.1); color: #00ff88; border: 1px solid rgba(0,255,100,0.2); }
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }
        .auth-divider hr { flex: 1; border: none; border-top: 1px solid rgba(255,255,255,0.07); }
        .auth-divider span { color: #444; font-size: 12px; }
        .auth-footer { text-align: center; margin-top: 20px; color: #555; font-size: 13px; }
        .auth-footer a { color: cyan; text-decoration: none; font-weight: bold; }
        .auth-footer a:hover { text-shadow: 0 0 8px cyan; }
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(0,0,0,0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><h1>NEONSHOP</h1></div>
        <nav class="menu">
            <a href="index.html">← Voltar</a>
            <button class="tema-btn" onclick="trocarTema()">🌙</button>
        </nav>
    </header>

    <div class="auth-page">
        <div class="auth-card">

            <div class="auth-logo">
                <h1>NEONSHOP</h1>
                <p>// ÁREA DO JOGADOR</p>
            </div>

            <div class="auth-title">Bem-vindo de volta 👋</div>
            <div class="auth-subtitle">Entre na sua conta para continuar</div>

            <div class="input-group">
                <label>Email</label>
                <div class="input-wrap">
                    <span class="input-icon">📧</span>
                    <input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="senha" placeholder="Sua senha" id="senha-input" autocomplete="current-password">
                    <button class="toggle-senha" type="button" onclick="toggleSenha('senha')">👁️</button>
                </div>
            </div>

            <button class="btn-auth" onclick="fazerLogin(this)">Entrar</button>

            <div class="auth-msg" id="mensagem"></div>

            <div class="auth-divider">
                <hr><span>ou</span><hr>
            </div>

            <button class="btn-outline" onclick="window.location.href='register.html'">
                ✨ Criar nova conta
            </button>

            <div class="auth-footer" style="margin-top:25px;">
                Problemas para entrar? <a href="#">Fale conosco</a>
            </div>

        </div>
    </div>

    <div id="toast"></div>
    <script type="module" src="js/script.js"></script>
    <script>
        function toggleSenha(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function mostrarMsg(texto, tipo) {
            const el = document.getElementById('mensagem');
            el.textContent = texto;
            el.className = 'auth-msg ' + tipo;
        }

        async function fazerLogin(btn) {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            if (!email || !senha) {
                mostrarMsg('Preencha todos os campos.', 'erro');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Entrando...';

            try {
                await window.login?.() || (() => {
                    throw new Error('Função login não encontrada');
                })();
            } catch(e) {
                // login() do script.js já trata o erro
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Entrar';
            }
        }

        // Permitir Enter para logar
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') fazerLogin(document.querySelector('.btn-auth'));
        });
    </script>
</body>
</html>
