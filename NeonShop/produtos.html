<!-- MOUSE -->

<div
    class="produto"
    data-categoria="mouse"
>

    <div
        class="favorito"
        onclick="toggleFavorito(this)"
    >
        ❤
    </div>

    <a
        href="mouse.html"
        class="produto-link"
    >

        <img
            src="img/mouse.jpg"
            alt="Mouse Gamer"
        >

        <h3>
            Mouse Gamer
        </h3>

    </a>

    <span>
        R$ 199.99
    </span>

    <button onclick="adicionarCarrinho(
        'Mouse Gamer',
        199.99,
        'img/mouse.jpg',
        10
    )">

        Comprar

    </button>

</div>
