<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeonShop</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

    <div class="logo">
        <h1>NEONSHOP</h1>
    </div>

    <nav class="menu">

        <a href="index.html">Home</a>
        <a href="">Produtos</a>
        <a href="">Categorias</a>
        <a href="carrinho.html">Carrinho</a>
        <a href="login.html">Login</a>

    </nav>

</header>
    <main>

        <section class="banner">

            <h2>Loja Gamer</h2>

            <p>Os melhores periféricos para seus jogos.</p>

            <button>Comprar Agora</button>

        </section>

        <section class="produtos">

            <h2 class="titulo-produtos">PRODUTOS</h2>

            <div class="grid-produtos">

                <div class="produto">

                    <img src="img/teclado.jpg" alt="Teclado Gamer">

                    <h3>Teclado Gamer</h3>

                    <p>RGB mecânico profissional.</p>

                    <span>R$ 299,99</span>

                    <button>Comprar</button>

                    <button onclick="adicionarCarrinho(
                    'Teclado Gamer',
                    299.99,
                    'img/teclado.jpg',
                    7312
                    )">
                    Adicionar ao Carrinho
                    </button>
                    

                </div>

                <div class="produto">

                    <img src="img/mouse.jpg" alt="Mouse Gamer">

                    <h3>Mouse Gamer</h3>

                    <p>Mouse ultra rápido RGB.</p>

                    <span>R$ 199,99</span>

                    <button>Comprar</button>

                    <button onclick="adicionarCarrinho(
                    'Mouse Gamer',
                    199.99,
                    'img/mouse.jpg',
                    1531
                    )">
                    Adicionar ao Carrinho
                    </button>

                </div>

                <div class="produto">

                    <img src="img/fone.jpg" alt="Fone Gamer">

                    <h3>Fone Gamer</h3>

                    <p>Áudio imersivo 7.1.</p>

                    <span>R$ 149,99</span>

                    <button>Comprar</button>

                    <button onclick="adicionarCarrinho(
                    'Fone Gamer',
                    149.99,
                    'img/fone.jpg',
                    131
                    )">
                    Adicionar ao Carrinho
                    </button>

                </div>

            </div>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
