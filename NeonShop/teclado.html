<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>
        Teclado Gamer
    </title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <h1>NEONSHOP</h1>
    </div>

</header>

<section class="produto-detalhe">

    <div class="produto-imagem">

        <img src="img/teclado.jpg">

    </div>

    <div class="produto-info">

        <h1>
            Teclado Gamer RGB
        </h1>

        <p class="produto-preco">
            R$ 299.99
        </p>

        <p class="produto-descricao">

            Teclado mecânico
            profissional RGB
            com switches rápidos
            e iluminação neon.

        </p>

        <div class="produto-extra">

            <p>✅ RGB Completo</p>
            <p>✅ Mecânico</p>
            <p>✅ Anti Ghosting</p>

        </div>

        <button onclick="adicionarCarrinho(
            'Teclado Gamer',
            299.99,
            'img/teclado.jpg',
            5
        )">

            Adicionar ao Carrinho

        </button>

    </div>

</section>

<script type="module" src="js/script.js"></script>

</body>

</html>
