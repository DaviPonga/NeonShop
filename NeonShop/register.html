<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - NeonShop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>NEONSHOP CADASTRO</h2>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
            >

            <input
                type="email"
                id="email"
                placeholder="Digite seu email"
            >

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
            >

            <button
                type="button"
                onclick="cadastrar()"
            >
                Cadastrar
            </button>

            <button
                type="button"
                class="cadastro-btn"
                onclick="window.location.href='login.html'"
            >
                Voltar para Login
            </button>

            <p id="mensagem"></p>
        </div>
    </div>
     <div id="toast"></div>
    <script src="js/script.js"></script>
   
</body>
</html>
