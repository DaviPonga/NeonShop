<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - NeonShop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>CRIAR CONTA</h2>
            <p style="color:#aaa;margin-bottom:25px;font-size:15px;">Junte-se à NeonShop</p>

            <input type="text" id="nome" placeholder="Seu nome completo">
            <input type="email" id="email" placeholder="Seu email">
            <input type="password" id="senha" placeholder="Senha (mín. 6 caracteres)">

            <button type="button" onclick="cadastrar()">Cadastrar</button>

            <button type="button" class="cadastro-btn"
                onclick="window.location.href='login.html'">
                Já tenho conta
            </button>

            <p id="mensagem"></p>
        </div>
    </div>

    <div id="toast"></div>
   <script type="module" src="js/script.js"></script>
</body>
</html>
